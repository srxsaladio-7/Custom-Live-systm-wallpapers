name: Build Nissan GTR Cool Live Wallpaper

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Create project directories
        run: |
          mkdir -p app/src/main/java/com/srxsaladio7/ngtrcustomlivewallpaper
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/raw

      - name: Verify Nissan GTR video
        run: |
          if [ ! -f "nissan_gtr.mp4" ]; then
            echo "ERROR: nissan_gtr.mp4 was not found in repository root."
            exit 1
          fi
          echo "Nissan GTR video found."
          ls -lh nissan_gtr.mp4

      - name: Copy Nissan GTR video
        run: |
          cp nissan_gtr.mp4 app/src/main/res/raw/nissan_gtr.mp4

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore gtr_test_release.jks \
            -storetype JKS \
            -alias gtr_test_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass gtr_test_store_pass \
            -keypass gtr_test_key_pass \
            -dname "CN=CustomLiveWallpaper03, OU=Wallpaper, O=SrXSaladio7, C=BD" \
            -noprompt

      - name: Write settings.gradle
        run: |
          cat > settings.gradle <<'GRADLE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Custom-Live-syst-wallpaper-03"
          include(":app")
          GRADLE

      - name: Write root build.gradle
        run: |
          cat > build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          GRADLE

      - name: Write gradle.properties
        run: |
          cat > gradle.properties <<'GRADLE'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          android.useAndroidX=true
          GRADLE

      - name: Write app/build.gradle
        run: |
          cat > app/build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace "com.srxsaladio7.ngtrcustomlivewallpaper"
              compileSdk 34

              defaultConfig {
                  applicationId "com.srxsaladio7.ngtrcustomlivewallpaper"
                  minSdk 21
                  targetSdk 22
                  versionCode 1
                  versionName "1.0"
              }

              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }

              signingConfigs {
                  release {
                      storeFile file("../gtr_test_release.jks")
                      storePassword "gtr_test_store_pass"
                      keyAlias "gtr_test_key"
                      keyPassword "gtr_test_key_pass"
                      v1SigningEnabled true
                      v2SigningEnabled true
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }

              androidResources {
                  noCompress 'mp4'
              }
          }
          GRADLE

      - name: Write AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature
                  android:name="android.software.live_wallpaper"
                  android:required="true" />

              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />

              <application
                  android:allowBackup="false"
                  android:hardwareAccelerated="true"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Black.NoTitleBar">

                  <service
                      android:name=".GtrWallpaperService"
                      android:enabled="true"
                      android:exported="true"
                      android:label="@string/wallpaper_name"
                      android:permission="android.permission.BIND_WALLPAPER">

                      <intent-filter>
                          <action android:name="android.service.wallpaper.WallpaperService" />
                      </intent-filter>

                      <meta-data
                          android:name="android.service.wallpaper"
                          android:resource="@xml/gtr_wallpaper" />

                  </service>

              </application>

          </manifest>
          XML

      - name: Write strings.xml
        run: |
          cat > app/src/main/res/values/strings.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">CustomLiveWallpaper-03</string>
              <string name="wallpaper_name">Nissan GTR</string>
              <string name="wallpaper_description">Nissan GTR Cool Live Wallpaper</string>
          </resources>
          XML

      - name: Write wallpaper metadata
        run: |
          cat > app/src/main/res/xml/gtr_wallpaper.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <wallpaper
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/wallpaper_description" />
          XML

      - name: Write GtrWallpaperService.java
        run: |
          cat > app/src/main/java/com/srxsaladio7/ngtrcustomlivewallpaper/GtrWallpaperService.java <<'JAVA'
          package com.srxsaladio7.ngtrcustomlivewallpaper;

          import android.media.MediaPlayer;
          import android.service.wallpaper.WallpaperService;
          import android.view.SurfaceHolder;

          public class GtrWallpaperService extends WallpaperService {

              @Override
              public Engine onCreateEngine() {
                  return new GtrEngine();
              }

              private final class GtrEngine extends Engine {
                  private MediaPlayer mediaPlayer;
                  private boolean visible;

                  @Override
                  public void onCreate(SurfaceHolder holder) {
                      super.onCreate(holder);
                      setTouchEventsEnabled(false);
                  }

                  @Override
                  public void onVisibilityChanged(boolean visible) {
                      this.visible = visible;
                      if (visible) {
                          startPlayback();
                      } else {
                          pausePlayback();
                      }
                  }

                  @Override
                  public void onSurfaceCreated(SurfaceHolder holder) {
                      super.onSurfaceCreated(holder);
                      createPlayer(holder);
                      if (visible) {
                          startPlayback();
                      }
                  }

                  @Override
                  public void onSurfaceChanged(
                          SurfaceHolder holder,
                          int format,
                          int width,
                          int height) {
                      super.onSurfaceChanged(
                              holder,
                              format,
                              width,
                              height
                      );
                  }

                  @Override
                  public void onSurfaceDestroyed(SurfaceHolder holder) {
                      pausePlayback();
                      releasePlayer();
                      super.onSurfaceDestroyed(holder);
                  }

                  @Override
                  public void onDestroy() {
                      pausePlayback();
                      releasePlayer();
                      super.onDestroy();
                  }

                  private void createPlayer(SurfaceHolder holder) {
                      if (mediaPlayer != null) {
                          return;
                      }
                      try {
                          int videoId = getResources().getIdentifier(
                                  "nissan_gtr",
                                  "raw",
                                  getPackageName()
                          );
                          if (videoId == 0) {
                              return;
                          }
                          mediaPlayer = MediaPlayer.create(
                                  GtrWallpaperService.this,
                                  videoId
                          );
                          if (mediaPlayer == null) {
                              return;
                          }
                          mediaPlayer.setLooping(true);
                          mediaPlayer.setScreenOnWhilePlaying(false);
                          mediaPlayer.setSurface(holder.getSurface());
                          mediaPlayer.setVolume(0.0f, 0.0f);
                          mediaPlayer.setOnErrorListener(
                                  new MediaPlayer.OnErrorListener() {
                                      @Override
                                      public boolean onError(
                                              MediaPlayer mp,
                                              int what,
                                              int extra) {
                                          releasePlayer();
                                          return true;
                                      }
                                  }
                          );
                      } catch (RuntimeException e) {
                          releasePlayer();
                      }
                  }

                  private void startPlayback() {
                      if (mediaPlayer == null) {
                          return;
                      }
                      try {
                          if (!mediaPlayer.isPlaying()) {
                              mediaPlayer.start();
                          }
                      } catch (IllegalStateException ignored) {
                      }
                  }

                  private void pausePlayback() {
                      if (mediaPlayer == null) {
                          return;
                      }
                      try {
                          if (mediaPlayer.isPlaying()) {
                              mediaPlayer.pause();
                          }
                      } catch (IllegalStateException ignored) {
                      }
                  }

                  private void releasePlayer() {
                      if (mediaPlayer == null) {
                          return;
                      }
                      try {
                          mediaPlayer.reset();
                      } catch (IllegalStateException ignored) {
                      }
                      try {
                          mediaPlayer.release();
                      } catch (Exception ignored) {
                      }
                      mediaPlayer = null;
                  }
              }
          }
          JAVA

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Build release APK
        run: |
          gradle clean :app:assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CustomLiveWallpaper-03
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
